---
# Deploy a complete httpd configuration: the main conf is templated from
# scratch (backing up the existing file), validated with `httpd -t`, and
# then applied with a graceful reload. A bad config can never be reloaded.

- name: Verify httpd is installed
  ansible.builtin.command:
    cmd: command -v httpd
  register: httpd_configure_present
  failed_when: false
  changed_when: false

- name: Fail early with a clear message if httpd is missing
  ansible.builtin.assert:
    that:
      - httpd_configure_present.rc == 0
    fail_msg: >-
      httpd is not installed on this host.
      Run the install play (playbooks/httpd.yml) first.
    quiet: true

# ---------------------------------------------------------------- directories ---
# The template references ServerRoot-relative and absolute paths; make sure
# every one of them exists before we ask httpd to parse the config.
- name: Ensure base directories exist (ServerRoot, conf, logs)
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - "{{ httpd_configure_server_root }}"
    - "{{ httpd_configure_server_root }}/conf"
    - "{{ httpd_configure_server_root }}/conf.d"
    - "{{ httpd_configure_server_root }}/conf.modules.d"
    - "{{ httpd_configure_server_root }}/logs"

- name: Ensure the document root exists with sane ownership
  ansible.builtin.file:
    path: "{{ httpd_configure_docroot }}"
    state: directory
    owner: apache
    group: apache
    mode: "0755"

- name: Check whether the standard mime.types file exists
  ansible.builtin.stat:
    path: "{{ httpd_configure_mime_types }}"
  register: httpd_configure_mime_stat
  changed_when: false

- name: Record mime types availability (drives an optional block in the template)
  ansible.builtin.set_fact:
    httpd_configure_mime_types_available: "{{ httpd_configure_mime_stat.stat.exists }}"

# ------------------------------------------------- stale drop-in cleanup ---
# An earlier iteration of this role managed configuration as a conf.d drop-in.
# That design is gone (the main conf is now fully templated), so remove the
# drop-in it left behind — its Listen directive would collide with the main
# conf (AH00526: multiple Listeners on the same IP:port).
- name: Check for a stale managed drop-in from the earlier design
  ansible.builtin.stat:
    path: "{{ httpd_configure_server_root }}/conf.d/90-aap-managed.conf"
  register: httpd_configure_dropin_stat

- name: Archive the stale managed drop-in
  ansible.builtin.copy:
    remote_src: true
    src: "{{ httpd_configure_server_root }}/conf.d/90-aap-managed.conf"
    dest: "{{ httpd_configure_server_root }}/conf.d/90-aap-managed.conf.removed"
    owner: root
    group: root
    mode: "0640"
  when: httpd_configure_dropin_stat.stat.exists

- name: Remove the stale managed drop-in
  ansible.builtin.file:
    path: "{{ httpd_configure_server_root }}/conf.d/90-aap-managed.conf"
    state: absent
  when: httpd_configure_dropin_stat.stat.exists

# ----------------------------------------------------------- deploy the config ---
- name: Deploy the templated main httpd.conf with a backup copy
  ansible.builtin.template:
    src: httpd.conf.j2
    dest: "{{ httpd_configure_main_conf }}"
    owner: root
    group: root
    mode: "0640"
    backup: true
  notify: Reloading httpd

# ------------------------------------------------------------ validate + reload ---
- name: Validate configuration syntax before allowing reload
  ansible.builtin.command:
    cmd: httpd -t -D DONT_LOCK_LOGS
  register: httpd_configure_test
  failed_when: false
  changed_when: false

- name: Gather evidence for a failed config test
  ansible.builtin.shell:  # noqa risky-shell-pipe
    cmd: >-
      echo "=== ServerRoot dir ===";
      ls -ld "{{ httpd_configure_server_root }}" 2>&1;
      echo "=== module dir ===";
      ls "{{ httpd_configure_server_root }}/conf.modules.d/" 2>&1 | head -8;
      echo "=== deployed ServerRoot line ===";
      grep -n '^ServerRoot' "{{ httpd_configure_main_conf }}" 2>&1
  register: httpd_configure_evidence
  failed_when: false
  changed_when: false
  when: httpd_configure_test.rc != 0

- name: Abandon change if new config is invalid (reload will not run)
  ansible.builtin.assert:
    that:
      - httpd_configure_test.rc == 0
    fail_msg: >-
      httpd -t failed. The service was NOT reloaded; fix the config and
      re-run.
      stderr: {{ httpd_configure_test.stderr | default('') }}
      host-evidence: |
        {{ httpd_configure_evidence.stdout | default('collect failed') }}

# ------------------------------------------------------------------- finishing ---
- name: Write index page into docroot
  ansible.builtin.copy:
    content: "{{ lookup('template', 'index.html.j2') }}"
    dest: "{{ httpd_configure_docroot }}/index.html"
    owner: apache
    group: apache
    mode: "0644"
  when: httpd_configure_write_index | bool

- name: Label document root for SELinux
  ansible.builtin.command:
    cmd: restorecon -Rv "{{ httpd_configure_docroot }}"
  register: httpd_configure_restorecon
  when: ansible_selinux.status | default('disabled') == 'enabled'
  failed_when: false
  changed_when: >-
    httpd_configure_restorecon.rc == 0
    and (httpd_configure_restorecon.stdout_lines | default([]) | length) > 0
  tags: [selinux]

- name: Ensure httpd service is enabled and active
  ansible.builtin.service:
    name: httpd
    state: started
    enabled: true
