---
# Compose the final report and print it to the job log.
# The job log IS the artifact — nothing is written or fetched.

- name: Compute overall severity
  ansible.builtin.set_fact:
    diag_severity: >-
      {{
        'fail' if (diag_findings | selectattr('level', 'equalto', 'fail') | list)
        else ('warn' if (diag_findings | selectattr('level', 'equalto', 'warn') | list)
        else 'ok')
      }}

- name: Shortlist suspect areas from fail/warn findings
  ansible.builtin.set_fact:
    diag_suspects: >-
      {{ (diag_findings
         | selectattr('level', 'in', ['fail', 'warn'])
         | map(attribute='area')
         | unique
         | list) }}

- name: Build report document
  ansible.builtin.set_fact:
    diag_report:
      host: "{{ inventory_hostname }}"
      os: "{{ ansible_distribution | default('unknown') }} {{ ansible_distribution_version | default('') }}"
      timestamp: "{{ now(utc=true).isoformat() }}"
      scoped_checks: "{{ diag_services }}"
      severity: "{{ diag_severity }}"
      suspect_areas: "{{ diag_suspects }}"
      findings: "{{ diag_findings }}"
      suggested_next:
        - "Re-run with -e diag_services=[<service>] once the suspect is known"
        - "sosreport --allow-missing -n triage for a full evidence pack"

- name: Build report header
  ansible.builtin.set_fact:
    diag_report_header: >-
      === DIAG REPORT — {{ diag_report.host }}
      — severity={{ diag_report.severity | upper }}
      — suspects={{ diag_report.suspect_areas | join(',') or 'none' }} ===

- name: Print diagnostic report
  ansible.builtin.debug:
    msg:
      - "{{ diag_report_header }}"
      - "{{ diag_report | to_nice_json(indent=2) }}"
