---
# Inventory for the AAP inventory source.
# Note: diag_expected_services is intentionally NOT set here —
# pass it as extra vars on the AAP job template, e.g.
#   diag_expected_services: [httpd]
all:
  children:
    web:
      hosts:
        banana:
          ansible_host: 10.128.2.9
        avocado:
          ansible_host: 10.128.2.8
  vars:
    ansible_user: cloud-user
    ansible_become: true
    ansible_become_method: sudo
    ansible_become_user: root
    ansible_python_interpreter: /usr/bin/python3
